<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIU Housing Society</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <div class="navbar">
        <nav>

            <div class="logo">
                <h2>UIU Housing Society</h2>
            </div>

            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">ABOUT</a></li>
                <li><a href="#">PROPERTY</a></li>
                <li><a href="#">PAGES</a></li>
                <li><a href="#">CONTACT</a></li>
            </ul>

            <button>Visit UCAM</button>

        </nav>
    </div>

    <!-- Hero Section -->
    <section class="hero">

        <!-- Left Side -->
        <div class="left">

            <h1>
                Find A <span>Perfect Flat</span> for <br>
                Teachers and Students
            </h1>

            <p>
                Amazing flats for teachers and students built with care.
                Please contact the UIU Housing Office.
            </p>

            <button>Explore UIU</button>

        </div>

        <!-- Right Side -->
        <div class="right">

            <img src="./com.jpg" alt="House">

        </div>

    </section>

    <!-- Search Section -->

    <section class="search">

        <input type="text" placeholder="Search Keyword">

        <select>
            <option>Property Type</option>
            <option>Flat</option>
            <option>Apartment</option>
            <option>House</option>
        </select>

        <select>
            <option>Location</option>
            <option>Dhaka</option>
            <option>Uttara</option>
            <option>Bashundhara</option>
        </select>

        <button>Search</button>

    </section>

</body>

</html>
